name: upgrade tests

# Installs the last 1.x release, fills it with elections in every stage, upgrades to this commit and checks that
# nothing was lost or changed (tests/upgrade).
on:
  push:
    branches: [master, version-2]
  pull_request:
  workflow_dispatch: {}

jobs:
  upgrade:
    uses: agileware/ci-workflows/.github/workflows/civicrm-extension-upgrade-tests.yml@main
    secrets:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      EXTENSION_NAME: au.com.agileware.elections
      FROM_REF: 1.3.2
