name: docs images

# Remakes the user guide's pictures (docs/images) on a fresh WordPress and CiviCRM site with
# tests/playwright/tools/docs-images.spec.ts, and opens a pull request with them into the branch it was run on.
# Run it by hand before a release (Actions > docs images > Run workflow, on the release branch), then look at every
# picture in the pull request before merging it. See developer/releases/README.md.

on:
  workflow_dispatch: {}
  # TEMPORARY: a second run from the version-2.2 branch, before this file is on master. Removed in the next commit.
  push:
    branches: [version-2.2]

jobs:
  screenshots:
    permissions:
      contents: write
      pull-requests: write
    uses: agileware/ci-workflows/.github/workflows/playwright-screenshots.yml@main
    secrets:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      EXTENSION_NAME: au.com.agileware.elections
      COMMAND: npm run docs-images
      OUTPUT_DIR: docs/images
      SETUP_SCRIPT: tests/playwright/fixtures/setup-environment.sh
      PR_TITLE: Update the user guide pictures
