<div af-fieldset="">
  <div class="election-action-bar election-list-actions" role="group" aria-label="{{:: ts('Actions') }}">
    <a class="af-button btn btn-primary election-action-primary election-action-end" crm-icon="fa-plus" ng-href="{{ crmUrl('civicrm/elections/create', {reset: 1}) }}">{{:: ts('Add Election') }}</a>
  </div>
  <details class="af-container" af-title="Filters" open="">
    <div class="af-container af-layout-inline">
      <af-field name="name" defn="{input_type: 'Text', label: 'Election', help_post: 'Part of the election\'s name.'}" />
      <af-field name="is_visible" defn="{label: 'Active', help_post: 'Yes shows active elections. No shows inactive elections.'}" />
      <af-field name="stage" defn="{label: 'Stage', help_post: 'Where the election is now, for example Inactive or Voting open.'}" />
      <af-field name="voting_end_date" defn="{input_type: 'Date', search_range: true, label: 'Voting closes', help_post: 'Elections whose voting closes in this period. Pick a ready-made period such as This month or Next 7 days, or enter your own dates.'}" />
      <af-field name="result_date" defn="{input_type: 'Date', search_range: true, label: 'Results published', help_post: 'Elections whose results are published in this period.'}" />
    </div>
    <button class="af-button btn btn-link election-clear-filters" type="reset">Clear filters</button>
  </details>
  <crm-search-display-table election-list-table="manage" search-name="ManageElections" display-name="ManageElections_Table_1"></crm-search-display-table>
</div>
